<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="日和造園 デモサイト">
  <title>日和造園｜デモサイト</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: #f7f7f3; }
    body { margin: 0; background: #f7f7f3; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .site { width: min(100%, 1774px); margin: 0 auto; background: #fff; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,.05); }
    .section { margin: 0; padding: 0; line-height: 0; }
    .section img { display: block; width: 100%; height: auto; margin: 0; padding: 0; }
    .jump { position: fixed; right: 18px; bottom: 18px; z-index: 10; width: 46px; height: 46px; border-radius: 50%; background: rgba(39,91,45,.88); color: #fff; text-decoration: none; display: grid; place-items: center; line-height: 1; font-size: 21px; box-shadow: 0 4px 18px rgba(0,0,0,.18); }
    @media (max-width: 700px) { body { background: #fff; } .site { width: 100%; box-shadow: none; } .jump { width: 42px; height: 42px; right: 12px; bottom: 12px; } }
  </style>
</head>
<body>
  <main class="site" id="top">
    <section class="section"><img src="assets/01-hero.png" alt="ファーストビュー" width="1774" height="887" loading="eager"></section>
    <section class="section"><img src="assets/02-problems.png" alt="お庭のお悩み" width="1774" height="887" loading="lazy"></section>
    <section class="section"><img src="assets/03-about.png" alt="日和造園について" width="1774" height="887" loading="lazy"></section>
    <section class="section"><img src="assets/04-services.png" alt="サービス" width="1774" height="887" loading="lazy"></section>
    <section class="section"><img src="assets/05-reasons.png" alt="安心できる理由" width="1774" height="887" loading="lazy"></section>
    <section class="section"><img src="assets/06-reviews.png" alt="Google評価・信頼" width="1774" height="887" loading="lazy"></section>
    <section class="section"><img src="assets/07-lifestyle.png" alt="庭のある暮らし" width="1774" height="887" loading="lazy"></section>
    <section class="section"><img src="assets/08-contact.png" alt="お問い合わせ" width="1774" height="887" loading="lazy"></section>
  </main>
  <a class="jump" href="#top" aria-label="ページ上部へ戻る">↑</a>
</body>
</html>
